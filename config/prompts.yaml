# Prompt Templates for Care-Beacon Medical RAG System

# System prompt for medical Q&A
system_prompt: |
  You are a helpful medical information assistant for BC Cancer. Your role is to provide accurate, well-cited information about cancer based on official BC Cancer educational materials.

  Guidelines:
  1. Answer questions clearly and concisely based ONLY on the provided context
  2. Always cite your sources using the format: [Source: Article Title - Section]
  3. If the context doesn't contain enough information to answer fully, say so
  4. When the context lists multiple items (tests, symptoms, treatments, etc.), include ALL of them for completeness
  5. Use simple, patient-friendly language
  6. Be empathetic and supportive in your tone
  7. Never provide personal medical advice or diagnoses
  8. Always remind patients to consult with healthcare providers

  Remember: You are providing educational information, not medical advice.

# User prompt template for Q&A with context
qa_prompt_template: |
  Based on the following information from BC Cancer educational materials, please answer the patient's question.

  CONTEXT:
  {context}

  QUESTION: {question}

  Please provide a clear, accurate answer based on the context above. Include citations to specific sources using the format [Source: Article Title - Section]. If the context doesn't fully answer the question, acknowledge what information is available and what isn't.

# Alternative prompt for when requiring strict citations
qa_strict_citations_template: |
  You are answering questions using official BC Cancer educational materials. You MUST cite every statement using the provided sources.

  AVAILABLE SOURCES:
  {context}

  PATIENT QUESTION: {question}

  Instructions:
  1. Answer the question using ONLY information from the sources above
  2. After each factual statement, add a citation: [Source: Article Title - Section]
  3. If sources don't contain the answer, clearly state: "The provided materials don't contain specific information about this topic."
  4. When sources list multiple items (tests, symptoms, treatments, side effects, etc.), include ALL of them - don't summarize or omit any
  5. Use patient-friendly language
  6. Be thorough and complete while remaining concise

  Your answer:

# Prompt for follow-up questions
followup_prompt_template: |
  Previous conversation:
  Q: {previous_question}
  A: {previous_answer}

  New sources:
  {context}

  Follow-up question: {question}

  Please answer the follow-up question, considering the previous context but focusing on new information from the sources provided. Include citations.

# Prompt for summarization
summarize_prompt_template: |
  Please summarize the following medical information from BC Cancer in 2-3 clear, concise sentences:

  {context}

  Summary:

# Prompt for extracting key points
key_points_template: |
  Extract the 3-5 most important points from this medical information:

  {context}

  Key points:

# Disclaimer text
medical_disclaimer: |
  This information is for educational purposes only. It is not a substitute for professional medical advice, diagnosis, or treatment. Please consult with a healthcare provider for medical advice.

# Error messages
no_context_found: |
  I couldn't find relevant information in the selected sources to answer your question. You may want to:
  1. Rephrase your question
  2. Contact BC Cancer directly for more specific information
  3. Speak with your healthcare provider

insufficient_context: |
  The available materials provide some related information, but may not fully address your specific question. Here's what I found:

# Quality control prompts
verify_citation_prompt: |
  Verify that all citations in the following answer correctly reference the provided sources:

  SOURCES:
  {sources}

  ANSWER:
  {answer}

  Are all citations accurate? Reply with: "Verified" or list any issues.

check_medical_accuracy_prompt: |
  Review this answer for medical accuracy and patient safety:

  {answer}

  Does this answer:
  1. Avoid giving personal medical advice?
  2. Encourage consulting healthcare providers?
  3. Present information accurately?

  Reply with: "Approved" or list concerns.
