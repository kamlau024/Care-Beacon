# Care-Beacon RAG Configuration

# Data Sources
data:
  articles_path: "scraped_data/articles"
  file_pattern: "**/*.md"

# Embeddings Configuration
embeddings:
  provider: "openai"  # openai or cohere
  model: "text-embedding-3-small"  # or text-embedding-3-large
  dimensions: 1536  # 1536 for small, 3072 for large
  batch_size: 50  # Number of texts to embed in one API call (reduced from 100 for low-memory environments)
  max_retries: 3
  retry_delay: 1.0  # seconds

# Vector Database (Chroma)
vector_db:
  collection_name: "care-beacon-medical"
  persist_directory: "data/vector_db"
  distance_metric: "cosine"  # cosine, l2, or ip

# Retrieval Configuration
retrieval:
  top_k: 10  # Number of chunks to retrieve
  min_similarity_threshold: 0.0  # Minimum similarity score (0-1), 0.0 = no filtering
  max_chunks_per_article: 20  # Diversity: max chunks from same article (increased from 3 for more comprehensive answers)
  enable_metadata_filtering: true
  rerank_results: true  # LLM-based re-ranking for better relevance
  include_metadata: true  # Include full metadata in results
  cache_query_embeddings: true  # Cache embeddings for repeated queries

# LLM Configuration
llm:
  provider: "openai"  # openai or anthropic
  model: "gpt-4o-mini"  # gpt-4o-mini (budget), gpt-4o (quality), or claude models
  max_tokens: 1000  # Max tokens in response
  temperature: 0.1  # Lower = more focused, higher = more creative
  max_retries: 3
  timeout: 30  # seconds

# Prompt Configuration
prompts:
  system_prompt_path: "config/prompts.yaml"
  include_disclaimers: true
  require_citations: true
  max_context_tokens: 6000  # Max tokens to send as context

# Cache Configuration (Redis)
cache:
  enabled: true  # Set to false to disable caching
  redis_host: "localhost"
  redis_port: 6379
  redis_db: 0
  redis_password: null  # Set if Redis requires authentication
  ttl_seconds: 3600  # Time to live in seconds (1 hour default)
  key_prefix: "care_beacon:"  # Prefix for all cache keys
  max_retries: 3  # Retry attempts for Redis operations
  timeout: 5  # Operation timeout in seconds

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins:
    - "*"  # Allow all origins for development (use specific domains in production)
  rate_limit:
    enabled: true
    requests_per_minute: 60

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  log_to_file: true
  log_file: "logs/care-beacon.log"
  rotation: "100 MB"  # Rotate when file reaches this size
  retention: "30 days"  # Keep logs for this duration

# Cost Tracking
cost_tracking:
  enabled: true
  log_file: "logs/api_costs.jsonl"
  embedding_cost_per_1k: 0.00002  # For text-embedding-3-small
  llm_cost_input_per_1k: 0.00015  # For GPT-4o-mini input
  llm_cost_output_per_1k: 0.0006  # For GPT-4o-mini output
  # Alternative pricing:
  # GPT-4o: input $0.0025/1k, output $0.01/1k
  # Claude Haiku: input $0.00025/1k, output $0.00125/1k
  # Claude Sonnet: input $0.003/1k, output $0.015/1k

# Medical Safety Configuration
safety:
  add_disclaimers: true
  disclaimer_text: "This information is for educational purposes only. It is not a substitute for professional medical advice, diagnosis, or treatment. Please consult with a healthcare provider for medical advice."
  flag_contradictions: false  # Future: detect contradictory information
  confidence_threshold: 0.7  # Don't answer if confidence below this
