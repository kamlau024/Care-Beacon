name: Tests

on:
  push:
  pull_request:

# No secrets are needed: Postgres tests skip without TEST_DATABASE_URL and
# Langfuse tracing stays off without LANGFUSE_* variables.
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Local dev uses 3.10; Vercel's `api` service runs 3.12.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      - run: npm test
      # `npm run lint` is not used: Next 16 removed `next lint`.
      - run: npx tsc --noEmit
      - run: npm run build
