projects:
  - name: Care Beacon
    environments:
      - name: production
        services:
          # Redis Cache
          - type: redis
            name: care-beacon-redis
            plan: free
            ipAllowList: []

          # FastAPI Backend
          - type: web
            name: care-beacon-api
            runtime: python
            plan: starter
            buildCommand: "chmod +x scripts/render_build.sh && ./scripts/render_build.sh"
            startCommand: "python scripts/start_api.py"
            autoDeploy: true
            branch: main
            buildFilter:
              paths:
                - src/**
                - scripts/**
                - config/**
                - scraped_data/**
                - requirements.txt
                - render.yaml
              ignoredPaths:
                - web-client/**
            envVars:
              - key: OPENAI_API_KEY
                sync: false
              - key: REDIS_URL
                fromService:
                  type: redis
                  name: care-beacon-redis
                  property: connectionString
              - key: PYTHON_VERSION
                value: "3.10.19"
              - key: ANONYMIZED_TELEMETRY
                value: "False"
            disk:
              name: vector-db-data
              mountPath: /opt/render/project/src/data
              sizeGB: 1

          # MCP Server (Remote HTTP/SSE)
          - type: web
            name: care-beacon-mcp
            runtime: python
            plan: starter
            buildCommand: "pip install -r requirements.txt"
            startCommand: "python mcp/sse/mcp_server.py"
            autoDeploy: true
            branch: main
            buildFilter:
              paths:
                - mcp/sse/**
                - requirements.txt
                - render.yaml
            envVars:
              - key: CARE_BEACON_API_URL
                fromService:
                  type: web
                  name: care-beacon-api
                  envVarKey: RENDER_EXTERNAL_URL
              - key: MCP_API_KEY
                generateValue: true
              - key: CARE_BEACON_TIMEOUT
                value: "60.0"
              - key: PORT
                value: "10000"
              - key: PYTHON_VERSION
                value: "3.10.19"

          # Next.js Frontend
          - type: web
            name: care-beacon
            runtime: node
            plan: free
            rootDir: web-client
            buildCommand: "npm install && npm run build"
            startCommand: "npm start"
            autoDeploy: true
            branch: main
            buildFilter:
              paths:
                - web-client/**
                - render.yaml
            envVars:
              - key: NEXT_PUBLIC_API_URL
                fromService:
                  type: web
                  name: care-beacon-api
                  envVarKey: RENDER_EXTERNAL_URL
              - key: NODE_VERSION
                value: "20"
