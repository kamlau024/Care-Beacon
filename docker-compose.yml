services:
  # API Service - FastAPI + RAG System + ChromaDB
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: care-beacon-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data              # Persist ChromaDB data
      - ./logs:/app/logs              # Persist logs
      - ./scraped_data:/app/scraped_data  # Source articles
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - care-beacon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis - Caching Layer
  redis:
    image: redis:7-alpine
    container_name: care-beacon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - care-beacon-network

  # Data Ingestion Service (run once or on-demand)
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: care-beacon-ingestion
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./data:/app/data              # Share ChromaDB data with API
      - ./scraped_data:/app/scraped_data  # Source articles
      - ./logs:/app/logs
    command: python scripts/ingest_data.py
    networks:
      - care-beacon-network
    profiles:
      - ingest  # Only runs with: docker-compose --profile ingest up ingestion

  # Redis Commander - Web UI for Redis (optional, for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: care-beacon-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - care-beacon-network
    profiles:
      - debug  # Only starts with: docker-compose --profile debug up

  # PostgreSQL with pgvector (optional - for future if you want to try PostgreSQL + pgvector instead of Chroma)
  # Uncomment if you want to experiment with pgvector
  # postgres:
  #   image: ankane/pgvector:latest
  #   container_name: care-beacon-postgres
  #   environment:
  #     POSTGRES_USER: carebeacon
  #     POSTGRES_PASSWORD: carebeacon_dev
  #     POSTGRES_DB: care_beacon
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U carebeacon"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  #   networks:
  #     - care-beacon-network

volumes:
  redis_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  care-beacon-network:
    driver: bridge
