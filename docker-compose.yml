services:
  # API Service - FastAPI + RAG System + Qdrant Cloud
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: care-beacon-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-carebeacon_redis_secret}
      # Vector Database Configuration (Qdrant Cloud)
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-qdrant}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./logs:/app/logs              # Persist logs
      - ./scraped_data:/app/scraped_data  # Source articles
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - care-beacon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MCP SSE Server - Model Context Protocol Server
  mcp-sse:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: care-beacon-mcp-sse
    ports:
      - "8001:8001"
    environment:
      - CARE_BEACON_API_URL=http://api:8000
      - PORT=8001
      - MCP_API_KEY=${MCP_API_KEY:-}
      - CARE_BEACON_TIMEOUT=60.0
    volumes:
      - ./mcp:/app/mcp  # MCP server code
    command: python mcp/sse/mcp_server.py
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - care-beacon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Web Client - Next.js Frontend
  web:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: care-beacon-web
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - care-beacon-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://0.0.0.0:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis - Caching Layer
  redis:
    image: redis:7-alpine
    container_name: care-beacon-redis
    # Port not published to host — only accessible within Docker network
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-carebeacon_redis_secret}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - care-beacon-network

  # Data Ingestion Service (run once or on-demand)
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: care-beacon-ingestion
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Vector Database Configuration (Qdrant Cloud)
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-qdrant}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./scraped_data:/app/scraped_data  # Source articles
      - ./logs:/app/logs
    command: python scripts/ingest_data.py
    networks:
      - care-beacon-network
    profiles:
      - ingest  # Only runs with: docker-compose --profile ingest up ingestion

  # Redis Commander - Web UI for Redis (optional, for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: care-beacon-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - care-beacon-network
    profiles:
      - debug  # Only starts with: docker-compose --profile debug up

  # PostgreSQL with pgvector (optional - for future if you want to try PostgreSQL + pgvector instead of Chroma)
  # Uncomment if you want to experiment with pgvector
  # postgres:
  #   image: ankane/pgvector:latest
  #   container_name: care-beacon-postgres
  #   environment:
  #     POSTGRES_USER: carebeacon
  #     POSTGRES_PASSWORD: carebeacon_dev
  #     POSTGRES_DB: care_beacon
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U carebeacon"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  #   networks:
  #     - care-beacon-network

  # Neo4j - Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: care-beacon-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - care-beacon-network

  # Graph RAG API Service
  graph-api:
    build:
      context: .
      dockerfile: Dockerfile.graph
    container_name: care-beacon-graph-api
    ports:
      - "8002:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Re-use Vector DB config if needed for hybrid
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-qdrant}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - care-beacon-network

volumes:
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  care-beacon-network:
    driver: bridge
